name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Convention guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Parses every module and enforces the hard rules from ENGINE_CONTRACT.md:
      # no Math.random, no runtime fetches, no remote URLs, no external asset
      # references, no stubs, and no dependencies outside the allowlist.
      - run: node tools/guard.mjs
      # Proves the guard still catches what it claims. The guard had a rule
      # scope that matched nothing on Windows, so it reported OK on a file
      # containing four separate violations -- and nothing tested it, so the
      # gap was invisible. This runs the guard against throwaway fixture
      # repos and asserts on the violations each one produces.
      - run: node tools/guard.test.mjs

  # The pixel-diff gate. The repository already ships the "before" — eight
  # committed PNGs in shots/ — and nothing compared a new capture against
  # them, so "prove visual changes in pixels" was honour-system. This compares
  # a fresh capture of each scenario against its committed baseline and fails
  # when a frame moved more than the threshold, or when a metric crossed out
  # of range.
  #
  # Runners have no GPU, so this renders through SwiftShader at a reduced
  # resolution, and cross-machine pixel equality is not a property this
  # project has or needs. So the gate is deliberately NOT "the frame must be
  # identical to its baseline" — it is "the frame must not have moved much,
  # and must still be in range", with the diff PNG attached for a human to
  # look at. A stored hash would fail for the same reason the README
  # describes: it collapses "the torch moved" and "everything is subtly
  # wrong" into the same opaque string.
  pixel-diff:
    name: Pixel diff vs baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diff against the committed baselines
        run: node tools/diff.mjs --software --w=640 --h=360 --frames=45 --threshold=0.25
      - name: Upload the diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diffs
          path: shots/_debug/diff/
          if-no-files-found: ignore

  smoke:
    name: Boot + determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runners have no GPU, so this renders through SwiftShader. Deliberately
      # small: software rasterising this scene is slow, and resolution dominates
      # that cost while barely affecting the simulation being checked.
      #
      # `combat` rather than a quieter scenario because it puts 9 actors under live
      # AI, which is what the determinism assertion needs something to bite on.
      # Note the check compares the two runs against EACH OTHER, not against a
      # golden hash -- software and hardware rendering legitimately differ, and
      # asserting cross-machine equality would produce a permanently red build.
      - name: Smoke test (software rendering)
        run: node tools/smoke.mjs --software --scenario=combat --frames=45 --w=480 --h=270
